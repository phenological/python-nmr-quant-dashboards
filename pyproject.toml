[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nmr-quant-dashboards"
version = "0.2.0"
description = "Matplotlib dashboards for NMR fit inspection and QA"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Julien Wist", email = "julien.wist@murdoch.edu.au" }]
keywords = ["nmr", "quantification", "matplotlib", "qa", "dashboard"]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scipy>=1.10",  # gaussian_kde for fit_quality_contours
    # No coupling to nmr-quant or a data loader: panels take pre-computed arrays.
]

[tool.hatch.build.targets.wheel]
packages = ["nmr_quant_dashboards"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "pandas>=2.0",  # tests build dataframes for fit_quality_contours
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=nmr_quant_dashboards --cov-report=term-missing"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
